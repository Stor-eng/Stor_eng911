<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | قطوف</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">

    <div id="authNavArea"></div>

    <div class="logo-box">
        ❖ قَــطُــوف ❖
    </div>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

</header>

<div class="top-buttons" id="topButtons">
    <button onclick="location.href='index.html'">الرئيسية</button>
    <button onclick="location.href='saved.html'">المحفوظ</button>
    <button>تواصل معنا</button>
    <button id="loginBtnStatic" onclick="location.href='login.html'">تسجيل الدخول</button>
</div>

<div class="auth-page">
  <form class="auth-card" onsubmit="handleSignup(event)">
    <h2>إنشاء حساب جديد</h2>

    <input type="text" id="signupName" placeholder="الاسم">
    <input type="email" id="signupEmail" placeholder="الإيميل">
    <input type="password" id="signupPassword" placeholder="كلمة السر">

    <select id="signupGender">
      <option value="male">ذكر</option>
      <option value="female">أنثى</option>
    </select>

    <p class="auth-error" id="signupError"></p>

    <button type="submit" class="auth-submit-btn">إنشاء الحساب</button>

    <p class="auth-switch">عندك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
  </form>
</div>

<!-- ===== نافذة تعديل بيانات الحساب ===== -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeEditModal()">✕</button>
    <h3>تعديل البيانات</h3>
    <form onsubmit="handleEditSave(event)">
      <input class="edit-input" type="text" id="editName" placeholder="الاسم">
      <input class="edit-input" type="email" id="editEmail" placeholder="الإيميل">
      <input class="edit-input" type="password" id="editPassword" placeholder="كلمة سر جديدة (اختياري)">
      <input class="edit-input" type="password" id="editCurrentPassword" placeholder="كلمة السر الحالية (لو هتغيّر الإيميل أو كلمة السر)">
      <p class="auth-error" id="editError"></p>
      <button type="submit" class="auth-submit-btn">حفظ التعديلات</button>
    </form>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
